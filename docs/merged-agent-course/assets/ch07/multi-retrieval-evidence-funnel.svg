<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="1100" viewBox="0 0 2100 1100" role="img" aria-labelledby="figure-7-5-svg-title figure-7-5-svg-desc">
  <title id="figure-7-5-svg-title">从多路检索到 Evidence Pack 的证据漏斗</title>
  <desc id="figure-7-5-svg-desc">可信身份、任务用途和数据域先形成授权过滤条件，随后结构化、稀疏、稠密和图检索并行产生候选。候选经过统一格式、融合去重、多维重排以及预算和覆盖选择，最终形成带来源与治理元数据的 Evidence Pack。未授权、已撤权、Tombstone、租户不匹配和注入风险候选在排序前被硬拒绝。</desc>
  <defs>
    <filter id="c5-rough-box" x="-3%" y="-5%" width="106%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.038" numOctaves="2" seed="59" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.05" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="c5-rough-title" x="-2%" y="-15%" width="104%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018 0.055" numOctaves="1" seed="31" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.65" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="c5-arrow-main" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 4 L0 8 Z" fill="#4b6f86"/>
    </marker>
    <marker id="c5-arrow-allow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 4 L0 8 Z" fill="#23806f"/>
    </marker>
    <marker id="c5-arrow-rank" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 4 L0 8 Z" fill="#9a6b12"/>
    </marker>
    <marker id="c5-arrow-reject" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 4 L0 8 Z" fill="#b55353"/>
    </marker>
    <style>
      text {
        font-family: "Kaiti SC", "STKaiti", "KaiTi", "PingFang SC", "Microsoft YaHei", sans-serif;
        letter-spacing: 0;
      }
      .title { font-size: 38px; font-weight: 700; fill: #172033; }
      .subtitle { font-size: 18px; fill: #526071; }
      .section { font-size: 24px; font-weight: 700; fill: #172033; }
      .section-note { font-size: 14px; fill: #647184; }
      .node-title { font-size: 20px; font-weight: 700; fill: #172033; }
      .channel-title { font-size: 18px; font-weight: 700; fill: #172033; }
      .body { font-size: 16px; fill: #344255; }
      .small { font-size: 14px; fill: #536171; }
      .micro { font-size: 12px; fill: #647184; }
      .boundary {
        stroke-width: 2.2;
        stroke-dasharray: 10 7;
        stroke-linejoin: round;
        fill-opacity: 0.50;
        filter: url(#c5-rough-box);
      }
      .box {
        stroke-width: 2.1;
        stroke-linejoin: round;
        filter: url(#c5-rough-box);
      }
      .main-edge {
        fill: none;
        stroke: #4b6f86;
        stroke-width: 2.5;
        stroke-linecap: butt;
        stroke-linejoin: miter;
        marker-end: url(#c5-arrow-main);
      }
      .allow-edge {
        fill: none;
        stroke: #23806f;
        stroke-width: 2.6;
        stroke-linecap: butt;
        stroke-linejoin: miter;
        marker-end: url(#c5-arrow-allow);
      }
      .rank-edge {
        fill: none;
        stroke: #9a6b12;
        stroke-width: 2.7;
        stroke-linecap: butt;
        stroke-linejoin: miter;
        marker-end: url(#c5-arrow-rank);
      }
      .reject-edge {
        fill: none;
        stroke: #b55353;
        stroke-width: 2.5;
        stroke-dasharray: 9 7;
        stroke-linecap: butt;
        stroke-linejoin: miter;
        marker-end: url(#c5-arrow-reject);
      }
      .bus {
        fill: none;
        stroke: #4b6f86;
        stroke-width: 2.2;
        stroke-linecap: butt;
        stroke-linejoin: miter;
      }
      .label-bg { fill: #fffdf8; opacity: 0.96; }
    </style>
  </defs>

  <rect width="2100" height="1100" fill="#fffdf8"/>

  <g filter="url(#c5-rough-title)">
    <text class="title" x="1050" y="58" text-anchor="middle">从多路检索到 Evidence Pack 的证据漏斗</text>
    <path d="M590 75 H1510" fill="none" stroke="#9a6b12" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text class="subtitle" x="1050" y="112" text-anchor="middle">先授权，再召回；先扩大候选覆盖，再用治理、排序和预算逐步收窄</text>

  <!-- Stage boundaries -->
  <rect class="boundary" x="45" y="155" width="320" height="790" rx="18" fill="#f7f7f5" stroke="#9aa39b"/>
  <rect class="boundary" x="405" y="155" width="375" height="790" rx="18" fill="#eef9f6" stroke="#55a997"/>
  <rect class="boundary" x="820" y="155" width="370" height="790" rx="18" fill="#fff8df" stroke="#c59a3a"/>
  <rect class="boundary" x="1230" y="155" width="350" height="790" rx="18" fill="#eff6fd" stroke="#79aee0"/>
  <rect class="boundary" x="1620" y="155" width="435" height="790" rx="18" fill="#f7f7f5" stroke="#9aa39b"/>

  <!-- Stage headings -->
  <text class="section" x="75" y="196">1 · 请求与治理边界</text>
  <text class="section-note" x="75" y="224">文本离开数据域之前完成硬过滤</text>

  <text class="section" x="435" y="196">2 · 四路并行检索</text>
  <text class="section-note" x="435" y="224">不同索引捕获不同类型的相关性</text>

  <text class="section" x="850" y="196">3 · 候选融合</text>
  <text class="section-note" x="850" y="224">统一交换格式，但不抹平来源语义</text>

  <text class="section" x="1260" y="196">4 · 多维重排与选择</text>
  <text class="section-note" x="1260" y="224">相关性之外还要考虑权威和风险</text>

  <text class="section" x="1650" y="196">5 · Evidence Pack</text>
  <text class="section-note" x="1650" y="224">模型只接收少量、可追溯的证据</text>

  <!-- Stage 1: request and hard filter -->
  <rect class="box" x="85" y="270" width="240" height="175" rx="14" fill="#fff8df" stroke="#c59a3a"/>
  <text class="node-title" x="205" y="309" text-anchor="middle">Retrieval Request</text>
  <text class="body" x="205" y="345" text-anchor="middle">任务 · 查询 · 数据域</text>
  <text class="body" x="205" y="377" text-anchor="middle">可信身份 · 用途 · 预算</text>
  <text class="micro" x="205" y="415" text-anchor="middle">不是只复制用户最后一句话</text>

  <path class="main-edge" d="M205 445 V515"/>
  <rect class="label-bg" x="216" y="469" width="82" height="24" rx="4"/>
  <text class="micro" x="257" y="486" text-anchor="middle">derive filters</text>

  <rect class="box" x="85" y="515" width="240" height="170" rx="14" fill="#fae9e6" stroke="#c36b6b"/>
  <text class="node-title" x="205" y="553" text-anchor="middle">Domain Hard Filter</text>
  <text class="body" x="205" y="588" text-anchor="middle">ACL · 租户 · 用途 · 有效期</text>
  <text class="body" x="205" y="620" text-anchor="middle">撤权 · Tombstone · 隔离</text>
  <text class="micro" x="205" y="647" text-anchor="middle">过滤条件下推到各检索器并持续生效</text>
  <text class="micro" x="205" y="670" text-anchor="middle">硬约束不能被相关性分数抵消</text>

  <path class="reject-edge" d="M205 685 V780"/>
  <rect class="label-bg" x="218" y="720" width="78" height="24" rx="4"/>
  <text class="micro" x="257" y="737" text-anchor="middle" fill="#b55353">blocked</text>

  <rect class="box" x="85" y="780" width="240" height="105" rx="12" fill="#fff3ef" stroke="#c36b6b"/>
  <text class="node-title" x="205" y="818" text-anchor="middle">Hard Reject</text>
  <text class="small" x="205" y="846" text-anchor="middle">未授权 · 已撤权 · 租户不匹配</text>
  <text class="micro" x="205" y="869" text-anchor="middle">已确认或已标记的注入风险</text>

  <!-- Authorized fan-out -->
  <path class="allow-edge" d="M325 600 H385"/>
  <path d="M385 315 V735" fill="none" stroke="#23806f" stroke-width="2.4"/>
  <path class="allow-edge" d="M385 315 H455"/>
  <path class="allow-edge" d="M385 455 H455"/>
  <path class="allow-edge" d="M385 595 H455"/>
  <path class="allow-edge" d="M385 735 H455"/>
  <rect class="label-bg" x="332" y="568" width="106" height="24" rx="4"/>
  <text class="micro" x="385" y="585" text-anchor="middle" fill="#23806f">过滤条件下推</text>

  <!-- Stage 2: retrieval channels -->
  <rect class="box" x="455" y="260" width="280" height="110" rx="12" fill="#f3f5f2" stroke="#8c978e"/>
  <circle cx="490" cy="315" r="22" fill="#dfe4df" stroke="#8c978e" stroke-width="1.7"/>
  <text class="node-title" x="490" y="322" text-anchor="middle">S</text>
  <text class="channel-title" x="530" y="299">Structured</text>
  <text class="body" x="530" y="330">时间 · 状态 · 用户 · 版本</text>
  <text class="micro" x="530" y="353">精确过滤与实体字段</text>

  <rect class="box" x="455" y="400" width="280" height="110" rx="12" fill="#e0eefb" stroke="#5e96ca"/>
  <circle cx="490" cy="455" r="22" fill="#cfe3f6" stroke="#5e96ca" stroke-width="1.7"/>
  <text class="node-title" x="490" y="462" text-anchor="middle">B</text>
  <text class="channel-title" x="530" y="439">Sparse / BM25</text>
  <text class="body" x="530" y="470">编号 · 错误码 · 专有名词</text>
  <text class="micro" x="530" y="493">精确字符串与罕见术语</text>

  <rect class="box" x="455" y="540" width="280" height="110" rx="12" fill="#dff4ee" stroke="#4f9f8e"/>
  <circle cx="490" cy="595" r="22" fill="#ccebe2" stroke="#4f9f8e" stroke-width="1.7"/>
  <text class="node-title" x="490" y="602" text-anchor="middle">D</text>
  <text class="channel-title" x="530" y="579">Dense / Embedding</text>
  <text class="body" x="530" y="610">语义相似 · 同义表达 · 意图</text>
  <text class="micro" x="530" y="633">允许词汇不重叠</text>

  <rect class="box" x="455" y="680" width="280" height="110" rx="12" fill="#f1ecfb" stroke="#8b75b4"/>
  <circle cx="490" cy="735" r="22" fill="#e3daf5" stroke="#8b75b4" stroke-width="1.7"/>
  <text class="node-title" x="490" y="742" text-anchor="middle">G</text>
  <text class="channel-title" x="530" y="719">Graph / Hierarchical</text>
  <text class="body" x="530" y="750">关系 · 谱系 · 层次 · 多跳</text>
  <text class="micro" x="530" y="773">扩展时必须控制噪声</text>

  <text class="small" x="592" y="875" text-anchor="middle">这一阶段追求覆盖，不把所有结果直接交给模型</text>

  <!-- Candidate collector -->
  <path class="bus" d="M735 315 H800"/>
  <path class="bus" d="M735 455 H800"/>
  <path class="bus" d="M735 595 H800"/>
  <path class="bus" d="M735 735 H800"/>
  <path class="bus" d="M800 315 V735"/>
  <path class="main-edge" d="M800 385 H865"/>
  <rect class="label-bg" x="746" y="349" width="109" height="24" rx="4"/>
  <text class="micro" x="800" y="366" text-anchor="middle" fill="#4b6f86">allowed candidates</text>

  <!-- Stage 3: candidate union and fusion -->
  <rect class="box" x="865" y="270" width="280" height="225" rx="14" fill="#fffdf8" stroke="#c59a3a"/>
  <text class="node-title" x="1005" y="309" text-anchor="middle">Normalized Candidate Pool</text>
  <text class="body" x="1005" y="346" text-anchor="middle">domain · canonical_ref</text>
  <text class="body" x="1005" y="378" text-anchor="middle">source_ref · version · ACL</text>
  <text class="body" x="1005" y="410" text-anchor="middle">sparse · dense · freshness</text>
  <text class="micro" x="1005" y="456" text-anchor="middle">统一格式不是统一语义</text>

  <path class="rank-edge" d="M1005 495 V555"/>

  <rect class="box" x="865" y="555" width="280" height="145" rx="14" fill="#ffefbd" stroke="#c59a3a"/>
  <text class="node-title" x="1005" y="596" text-anchor="middle">Fusion + Deduplicate</text>
  <text class="body" x="1005" y="633" text-anchor="middle">RRF 或已校准的加权融合</text>
  <text class="body" x="1005" y="665" text-anchor="middle">去重 · 近重复合并 · 来源保留</text>

  <rect class="box" x="865" y="770" width="280" height="105" rx="12" fill="#f7f7f5" stroke="#9aa39b"/>
  <text class="body" x="1005" y="808" text-anchor="middle">候选逐渐收窄</text>
  <text class="small" x="1005" y="839" text-anchor="middle">但仍保留数据域、来源和版本</text>
  <text class="micro" x="1005" y="862" text-anchor="middle">不能只剩一段无出处文本</text>

  <!-- Stage 4: rerank and evidence selection -->
  <path class="rank-edge" d="M1145 628 H1200 V405 H1270"/>
  <rect class="label-bg" x="1160" y="516" width="83" height="24" rx="4"/>
  <text class="micro" x="1202" y="533" text-anchor="middle" fill="#9a6b12">shortlist</text>

  <rect class="box" x="1270" y="275" width="270" height="250" rx="14" fill="#e0eefb" stroke="#5e96ca"/>
  <text class="node-title" x="1405" y="316" text-anchor="middle">Multi-signal Rerank</text>
  <text class="body" x="1405" y="354" text-anchor="middle">语义相关性 · 词法相关性</text>
  <text class="body" x="1405" y="386" text-anchor="middle">任务相关性 · 权威性 · 置信度</text>
  <text class="body" x="1405" y="418" text-anchor="middle">作用域 · 新鲜度 · 环境相似度</text>
  <text class="body" x="1405" y="450" text-anchor="middle">冲突惩罚 · 陈旧度 · 冗余</text>
  <text class="micro" x="1405" y="491" text-anchor="middle">不同数据域使用不同权重</text>

  <path class="rank-edge" d="M1405 525 V600"/>

  <rect class="box" x="1270" y="600" width="270" height="180" rx="14" fill="#fff8df" stroke="#c59a3a"/>
  <text class="node-title" x="1405" y="642" text-anchor="middle">Coverage + Budget</text>
  <text class="body" x="1405" y="679" text-anchor="middle">覆盖多个子问题和关键例外</text>
  <text class="body" x="1405" y="711" text-anchor="middle">在 token 预算内选择正文与摘要</text>
  <text class="micro" x="1405" y="751" text-anchor="middle">高分重复项不能挤掉必要证据</text>

  <text class="small" x="1405" y="872" text-anchor="middle">排序是治理后的优化，不是权限判断的替代品</text>

  <!-- Stage 5: Evidence Pack -->
  <path class="rank-edge" d="M1540 690 H1660"/>
  <rect class="label-bg" x="1562" y="655" width="78" height="24" rx="4"/>
  <text class="micro" x="1601" y="672" text-anchor="middle" fill="#9a6b12">selected</text>

  <rect class="box" x="1660" y="265" width="355" height="570" rx="16" fill="#fffdf8" stroke="#8c978e"/>
  <text class="node-title" x="1838" y="306" text-anchor="middle">Relevant Persistent Information</text>
  <text class="micro" x="1838" y="332" text-anchor="middle">untrusted data, not instructions</text>

  <rect class="box" x="1690" y="365" width="295" height="120" rx="11" fill="#dff4ee" stroke="#4f9f8e"/>
  <text class="node-title" x="1715" y="400">Memory Evidence</text>
  <text class="small" x="1715" y="433">主体 · 作用域 · 证据强度 · 冲突状态</text>
  <text class="micro" x="1715" y="461">memory://mem_42 · source · updated_at</text>

  <rect class="box" x="1690" y="515" width="295" height="120" rx="11" fill="#e0eefb" stroke="#5e96ca"/>
  <text class="node-title" x="1715" y="550">Knowledge Evidence</text>
  <text class="small" x="1715" y="583">权威版本 · 地域 · 有效期 · 原文位置</text>
  <text class="micro" x="1715" y="611">knowledge://chunk_19 · policy-v7</text>

  <rect class="box" x="1690" y="665" width="295" height="120" rx="11" fill="#fae9e6" stroke="#c36b6b"/>
  <text class="node-title" x="1715" y="700">Conflict / Constraint</text>
  <text class="small" x="1715" y="733">保留反例、限制条件和未解决冲突</text>
  <text class="micro" x="1715" y="761">不得被多数结果或高相似度静默覆盖</text>

  <text class="small" x="1838" y="870" text-anchor="middle">最终上下文携带 domain · source · version · ACL · validity</text>

  <!-- Legend -->
  <g transform="translate(70 1020)">
    <path d="M0 0 H52" class="allow-edge"/>
    <text class="small" x="68" y="5">授权后的检索范围</text>
    <path d="M310 0 H362" class="main-edge"/>
    <text class="small" x="378" y="5">候选数据流</text>
    <path d="M560 0 H612" class="rank-edge"/>
    <text class="small" x="628" y="5">融合、排序与选择</text>
    <path d="M865 0 H917" class="reject-edge"/>
    <text class="small" x="933" y="5">排序前硬拒绝</text>
    <text class="micro" x="1960" y="5" text-anchor="end">证据漏斗的目标不是找到“最像”的文本，而是形成当前任务可安全使用的最小充分证据集</text>
  </g>
</svg>
