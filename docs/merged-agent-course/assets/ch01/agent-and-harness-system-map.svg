<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" width="1200" height="920">
  <style>
    text { font-family: 'Comic Sans MS', 'Kaiti SC', 'KaiTi', 'PingFang SC', sans-serif; letter-spacing: 0; }
    .title { font-size: 30px; font-weight: 700; fill: #172033; }
    .subtitle { font-size: 15px; fill: #667085; }
    .section { font-size: 20px; font-weight: 700; fill: #172033; }
    .heading { font-size: 17px; font-weight: 700; fill: #263244; }
    .label { font-size: 14px; font-weight: 700; fill: #263244; }
    .small { font-size: 13px; fill: #475467; }
    .tiny { font-size: 12px; fill: #667085; }
    .outline { stroke-width: 2.1; stroke-linejoin: round; stroke-linecap: round; filter: url(#rough); }
    .edge { fill: none; stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; filter: url(#rough); }
  </style>
  <defs>
    <filter id="rough" x="-40" y="-40" width="1280" height="1000" filterUnits="userSpaceOnUse">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.25" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#9333ea"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#ea580c"/>
    </marker>
  </defs>

  <rect width="1200" height="920" fill="#ffffff"/>
  <text x="60" y="48" class="title">Agent 与 Harness 的两层系统地图</text>
  <text x="60" y="78" class="subtitle">上层回答“什么是智能体”，下层回答“怎样把 LLM 的决策能力做成可靠产品”</text>

  <rect x="60" y="105" width="1080" height="265" rx="10" fill="#fbfcfe" stroke="#98a2b3" class="outline"/>
  <text x="85" y="140" class="section">A. 通用智能体：目标驱动的环境交互</text>

  <rect x="90" y="160" width="1020" height="55" rx="8" fill="#fff4e8" stroke="#f59e62" class="outline"/>
  <text x="600" y="184" text-anchor="middle" class="heading">Goal + Performance Measure</text>
  <text x="600" y="204" text-anchor="middle" class="small">目标状态、成本、风险、完成条件与奖励信号</text>

  <rect x="100" y="245" width="350" height="90" rx="9" fill="#eaf3ff" stroke="#72a7e8" class="outline"/>
  <text x="275" y="276" text-anchor="middle" class="heading">Environment</text>
  <text x="275" y="299" text-anchor="middle" class="small">外部世界 · 其他行动者 · 实时状态</text>
  <text x="275" y="319" text-anchor="middle" class="tiny">环境可能部分可观察、动态且随机</text>

  <rect x="750" y="235" width="350" height="110" rx="9" fill="#eafbf7" stroke="#42b9a8" class="outline"/>
  <text x="925" y="268" text-anchor="middle" class="heading">Agent</text>
  <text x="925" y="294" text-anchor="middle" class="small">Policy / Model + Internal State</text>
  <text x="925" y="318" text-anchor="middle" class="small">理解目标 · 估计状态 · 选择行动</text>

  <path d="M458 262 H742" stroke="#2563eb" class="edge" marker-end="url(#arrow-blue)"/>
  <rect x="555" y="243" width="92" height="19" rx="4" fill="#fbfcfe"/>
  <text x="601" y="257" text-anchor="middle" class="tiny">Observation</text>

  <path d="M742 316 H458" stroke="#16a34a" class="edge" marker-end="url(#arrow-green)"/>
  <rect x="569" y="316" width="64" height="19" rx="4" fill="#fbfcfe"/>
  <text x="601" y="330" text-anchor="middle" class="tiny">Action</text>
  <path d="M925 223 V227" stroke="#ea580c" class="edge" marker-end="url(#arrow-orange)"/>

  <rect x="60" y="405" width="1080" height="455" rx="10" fill="#fbfcfe" stroke="#98a2b3" class="outline"/>
  <text x="85" y="440" class="section">B. LLM Agent 产品 = Model + Harness</text>

  <rect x="90" y="500" width="150" height="90" rx="8" fill="#eaf3ff" stroke="#72a7e8" class="outline"/>
  <text x="165" y="532" text-anchor="middle" class="label">入口与触发</text>
  <text x="165" y="556" text-anchor="middle" class="small">User / API</text>
  <text x="165" y="576" text-anchor="middle" class="small">Event / Cron</text>

  <rect x="290" y="470" width="640" height="365" rx="12" fill="#ffffff" stroke="#667085" class="outline"/>
  <text x="315" y="500" class="heading">Operational Runtime</text>
  <text x="487" y="500" class="tiny">编排 Model 与 Harness 的交互</text>

  <rect x="330" y="525" width="180" height="80" rx="8" fill="#f6efff" stroke="#a989d4" class="outline"/>
  <text x="420" y="555" text-anchor="middle" class="label">Orchestrator</text>
  <text x="420" y="579" text-anchor="middle" class="small">会话 · 路由 · 恢复</text>

  <rect x="700" y="525" width="190" height="80" rx="8" fill="#eafbf7" stroke="#42b9a8" class="outline"/>
  <text x="795" y="555" text-anchor="middle" class="label">Model</text>
  <text x="795" y="579" text-anchor="middle" class="small">理解目标 · 选择行动</text>

  <path d="M248 545 H322" stroke="#2563eb" class="edge" marker-end="url(#arrow-blue)"/>
  <path d="M518 565 H692" stroke="#2563eb" class="edge" marker-end="url(#arrow-blue)"/>
  <rect x="573" y="548" width="72" height="19" rx="4" fill="#ffffff"/>
  <text x="609" y="562" text-anchor="middle" class="tiny">Agent Loop</text>

  <rect x="990" y="500" width="130" height="90" rx="8" fill="#ecf9ef" stroke="#6cc982" class="outline"/>
  <text x="1055" y="532" text-anchor="middle" class="label">结果</text>
  <text x="1055" y="556" text-anchor="middle" class="small">Response</text>
  <text x="1055" y="576" text-anchor="middle" class="small">Side Effect</text>
  <path d="M898 545 H982" stroke="#16a34a" class="edge" marker-end="url(#arrow-green)"/>

  <text x="330" y="623" class="tiny">Harness capabilities：向 Model 提供信息、行动接口和硬边界</text>
  <path d="M392 642 V635 H827" stroke="#9333ea" class="edge"/>
  <path d="M795 635 V613" stroke="#9333ea" class="edge" marker-end="url(#arrow-purple)"/>

  <rect x="330" y="650" width="125" height="78" rx="8" fill="#fff4e8" stroke="#f59e62" class="outline"/>
  <text x="392" y="678" text-anchor="middle" class="label">Prompt</text>
  <text x="392" y="699" text-anchor="middle" class="small">Context</text>
  <text x="392" y="718" text-anchor="middle" class="tiny">Knowledge</text>

  <rect x="475" y="650" width="125" height="78" rx="8" fill="#eaf3ff" stroke="#72a7e8" class="outline"/>
  <text x="537" y="678" text-anchor="middle" class="label">Observation</text>
  <text x="537" y="699" text-anchor="middle" class="small">Tools</text>
  <text x="537" y="718" text-anchor="middle" class="tiny">Actions</text>

  <rect x="620" y="650" width="125" height="78" rx="8" fill="#f6efff" stroke="#a989d4" class="outline"/>
  <text x="682" y="678" text-anchor="middle" class="label">Session</text>
  <text x="682" y="699" text-anchor="middle" class="small">State</text>
  <text x="682" y="718" text-anchor="middle" class="tiny">Memory</text>

  <rect x="765" y="650" width="125" height="78" rx="8" fill="#fff1f2" stroke="#e58b98" class="outline"/>
  <text x="827" y="678" text-anchor="middle" class="label">Permission</text>
  <text x="827" y="699" text-anchor="middle" class="small">Sandbox</text>
  <text x="827" y="718" text-anchor="middle" class="tiny">Human Approval</text>

  <path d="M537 642 V635" stroke="#9333ea" class="edge"/>
  <path d="M682 642 V635" stroke="#9333ea" class="edge"/>
  <path d="M827 642 V635" stroke="#9333ea" class="edge"/>

  <rect x="290" y="790" width="640" height="45" rx="8" fill="#f8f9fb" stroke="#cbd0d8" class="outline"/>
  <text x="610" y="818" text-anchor="middle" class="label">Harness Evidence Plane：Tracing · Evaluation · Feedback · Cost</text>
</svg>
