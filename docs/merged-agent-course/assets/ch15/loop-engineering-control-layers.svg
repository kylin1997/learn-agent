<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820">
  <style>
    text { font-family: 'Comic Sans MS', 'Kaiti SC', 'KaiTi', 'PingFang SC', sans-serif; letter-spacing: 0; }
    .title { font-size: 30px; font-weight: 700; fill: #172033; }
    .subtitle { font-size: 15px; fill: #667085; }
    .h { font-size: 19px; font-weight: 700; fill: #172033; }
    .label { font-size: 15px; font-weight: 700; fill: #263244; }
    .small { font-size: 13px; fill: #475467; }
    .tiny { font-size: 12px; fill: #667085; }
    .outline { stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; filter: url(#rough); }
    .edge { fill: none; stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; filter: url(#rough); }
  </style>
  <defs>
    <filter id="rough" x="-50" y="-50" width="1300" height="920" filterUnits="userSpaceOnUse">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.35" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#9333ea"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#ea580c"/>
    </marker>
  </defs>

  <rect width="1200" height="820" fill="#ffffff"/>
  <text x="60" y="52" class="title">Loop Engineering 的控制层级</text>
  <text x="60" y="82" class="subtitle">Agent Loop 负责当前行动，Harness 负责可靠运行，Loop Engineering 负责目标、反馈、状态与停止</text>

  <rect x="60" y="110" width="1080" height="90" rx="9" fill="#fff4e8" stroke="#f59e62" class="outline"/>
  <text x="90" y="145" class="h">Human Governance</text>
  <text x="90" y="174" class="small">目标与价值 · 范围与预算 · 权限与审批 · Verifier 设计 · 抽样理解 · 最终责任</text>
  <path d="M600 208 V227" stroke="#ea580c" class="edge" marker-end="url(#arrow-orange)"/>

  <rect x="60" y="235" width="1080" height="410" rx="10" fill="#fbfcfe" stroke="#98a2b3" class="outline"/>
  <text x="86" y="273" class="h">Loop Engineering</text>
  <text x="267" y="273" class="small">围绕目标组织一次或多次执行</text>

  <rect x="90" y="330" width="130" height="90" rx="8" fill="#eaf3ff" stroke="#72a7e8" class="outline"/>
  <text x="155" y="366" text-anchor="middle" class="label">Trigger</text>
  <text x="155" y="394" text-anchor="middle" class="small">事件 / Cron / 人</text>

  <rect x="270" y="330" width="150" height="90" rx="8" fill="#f6efff" stroke="#a989d4" class="outline"/>
  <text x="345" y="366" text-anchor="middle" class="label">Discover &amp; Plan</text>
  <text x="345" y="394" text-anchor="middle" class="small">选目标与动作</text>

  <rect x="470" y="300" width="290" height="150" rx="9" fill="#ffffff" stroke="#667085" class="outline"/>
  <text x="495" y="333" class="h">Agent Harness</text>
  <text x="495" y="354" class="tiny">上下文 · 工具 · 权限 · 沙箱 · 路由 · 错误处理</text>
  <rect x="510" y="370" width="210" height="58" rx="8" fill="#eafbf7" stroke="#42b9a8" class="outline"/>
  <text x="615" y="397" text-anchor="middle" class="label">Agent Loop</text>
  <text x="615" y="418" text-anchor="middle" class="small">Model → Tool → Observe</text>
  <path d="M728 382 C750 382 750 416 728 416" stroke="#16a34a" class="edge" marker-end="url(#arrow-green)"/>

  <rect x="810" y="330" width="130" height="90" rx="8" fill="#ecf9ef" stroke="#6cc982" class="outline"/>
  <text x="875" y="366" text-anchor="middle" class="label">Verify</text>
  <text x="875" y="394" text-anchor="middle" class="small">测试 / 状态 / 人</text>

  <rect x="990" y="330" width="130" height="90" rx="8" fill="#fff4e8" stroke="#f59e62" class="outline"/>
  <text x="1055" y="366" text-anchor="middle" class="label">Decide</text>
  <text x="1055" y="394" text-anchor="middle" class="small">继续 / 停止 / 升级</text>

  <path d="M228 375 H262" stroke="#2563eb" class="edge" marker-end="url(#arrow-blue)"/>
  <path d="M428 375 H462" stroke="#2563eb" class="edge" marker-end="url(#arrow-blue)"/>
  <path d="M768 375 H802" stroke="#16a34a" class="edge" marker-end="url(#arrow-green)"/>
  <path d="M948 375 H982" stroke="#16a34a" class="edge" marker-end="url(#arrow-green)"/>

  <path d="M1055 428 V500 H345 V428" stroke="#9333ea" stroke-dasharray="8 6" class="edge" marker-end="url(#arrow-purple)"/>
  <rect x="514" y="475" width="322" height="23" rx="5" fill="#fbfcfe"/>
  <text x="675" y="491" text-anchor="middle" class="tiny">反馈改变下一轮计划，而不是无条件重试</text>

  <rect x="250" y="545" width="700" height="60" rx="8" fill="#ffffff" stroke="#98a2b3" class="outline"/>
  <text x="600" y="581" text-anchor="middle" class="label">State · Evidence · Checkpoint · Budget</text>
  <text x="972" y="581" class="tiny">共享运行底座</text>

  <rect x="60" y="680" width="1080" height="80" rx="9" fill="#f8f9fb" stroke="#cbd0d8" class="outline"/>
  <text x="90" y="713" class="label">判定标准</text>
  <text x="90" y="741" class="small">只有外部反馈能够拒绝错误，并改变下一步行动时，重复执行才成为真正的反馈闭环。</text>
  <g transform="translate(805, 712)">
    <path d="M0 0 H28" stroke="#2563eb" class="edge" marker-end="url(#arrow-blue)"/>
    <text x="40" y="5" class="tiny">执行</text>
    <path d="M100 0 H128" stroke="#16a34a" class="edge" marker-end="url(#arrow-green)"/>
    <text x="140" y="5" class="tiny">验证</text>
    <path d="M200 0 H228" stroke="#9333ea" stroke-dasharray="7 5" class="edge" marker-end="url(#arrow-purple)"/>
    <text x="240" y="5" class="tiny">反馈</text>
  </g>
</svg>
