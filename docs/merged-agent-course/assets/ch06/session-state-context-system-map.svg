<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc">
  <title id="title">会话、状态与上下文工程系统地图</title>
  <desc id="desc">事件进入追加式记录，归约为执行状态，再由 GSSC 构造模型上下文；检查点支持恢复、回放与分叉。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="strokeWidth" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 Z" fill="#334155"/>
    </marker>
    <filter id="paper" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="17" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray" result="faint"><feFuncA type="table" tableValues="0 0.035"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faint" mode="multiply"/>
    </filter>
    <style>
      .title { font: 700 30px "Kaiti SC", "STKaiti", "Comic Sans MS", sans-serif; fill: #172033; }
      .subtitle { font: 16px "Kaiti SC", "STKaiti", sans-serif; fill: #475569; }
      .lane { font: 700 18px "Kaiti SC", "STKaiti", sans-serif; fill: #243047; }
      .box-title { font: 700 19px "Kaiti SC", "STKaiti", sans-serif; fill: #172033; }
      .body { font: 15px "Kaiti SC", "STKaiti", sans-serif; fill: #334155; }
      .tiny { font: 13px "Kaiti SC", "STKaiti", sans-serif; fill: #475569; }
      .box { stroke: #334155; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .arrow { fill: none; stroke: #334155; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .soft-arrow { fill: none; stroke: #64748b; stroke-width: 1.9; stroke-dasharray: 7 6; stroke-linecap: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1280" height="900" fill="#fffdf8"/>
  <g filter="url(#paper)">
    <text x="640" y="48" text-anchor="middle" class="title">会话、状态与上下文工程</text>
    <text x="640" y="76" text-anchor="middle" class="subtitle">记录完整运行证据，维护可恢复状态，只把当前决策需要的信息交给模型</text>

    <text x="55" y="126" class="lane">记录平面</text>
    <path d="M 44 137 C 46 134, 50 137, 52 134" fill="none" stroke="#e05d44" stroke-width="3" stroke-linecap="round"/>

    <rect x="80" y="150" width="210" height="118" rx="7" class="box" fill="#fff1bf"/>
    <text x="185" y="180" text-anchor="middle" class="box-title">事件生产者</text>
    <text x="105" y="207" class="body">用户 · 模型 · 工具</text>
    <text x="105" y="232" class="body">审批 · 超时 · 取消</text>
    <text x="105" y="254" class="tiny">每次变化都产生事件</text>

    <rect x="385" y="135" width="300" height="148" rx="6" class="box" fill="#d9efff"/>
    <path d="M 394 144 C 460 132, 612 141, 677 144" fill="none" stroke="#334155" stroke-width="1.2" opacity="0.45"/>
    <text x="535" y="169" text-anchor="middle" class="box-title">Append-only Event Log</text>
    <text x="410" y="198" class="body">session / run / turn / seq</text>
    <text x="410" y="224" class="body">因果 ID · 幂等键 · 安全标签</text>
    <text x="410" y="250" class="tiny">原始运行证据不被压缩覆盖</text>

    <rect x="790" y="150" width="260" height="118" rx="7" class="box" fill="#ffe1da"/>
    <text x="920" y="180" text-anchor="middle" class="box-title">Artifact Store</text>
    <text x="815" y="207" class="body">日志 · 文件 · 工具大结果</text>
    <text x="815" y="232" class="body">路径 · 哈希 · 预览 · 权限</text>
    <text x="815" y="254" class="tiny">事件只保存稳定引用</text>

    <path d="M 290 208 C 318 205, 340 211, 365 208 L 383 208" class="arrow"/>
    <path d="M 685 208 C 715 205, 740 211, 770 208 L 788 208" class="soft-arrow"/>

    <text x="55" y="352" class="lane">状态平面</text>
    <path d="M 44 363 C 47 360, 50 363, 53 360" fill="none" stroke="#268b73" stroke-width="3" stroke-linecap="round"/>

    <rect x="220" y="378" width="220" height="112" rx="7" class="box" fill="#e2f4df"/>
    <text x="330" y="410" text-anchor="middle" class="box-title">State Reducer</text>
    <text x="245" y="438" class="body">按事件确定性归约</text>
    <text x="245" y="463" class="tiny">schema + invariant + revision</text>

    <rect x="520" y="360" width="270" height="148" rx="7" class="box" fill="#e8def8"/>
    <text x="655" y="392" text-anchor="middle" class="box-title">Operational State</text>
    <text x="545" y="421" class="body">目标 · 阶段 · 计划 · 约束</text>
    <text x="545" y="447" class="body">待办 · 审批 · 副作用 · 预算</text>
    <text x="545" y="477" class="tiny">回答“现在怎样继续执行”</text>

    <rect x="875" y="378" width="250" height="112" rx="7" class="box" fill="#dff2ed"/>
    <text x="1000" y="410" text-anchor="middle" class="box-title">Checkpoint History</text>
    <text x="900" y="438" class="body">through_seq · state hash</text>
    <text x="900" y="463" class="tiny">快照、版本与分支谱系</text>

    <path d="M 535 283 C 535 319, 330 319, 330 358 L 330 376" class="arrow"/>
    <text x="425" y="313" text-anchor="middle" class="tiny">Event replay（只归约状态）</text>
    <path d="M 440 434 C 464 431, 480 437, 500 434 L 518 434" class="arrow"/>
    <path d="M 790 434 C 814 431, 832 437, 855 434 L 873 434" class="arrow"/>

    <text x="55" y="584" class="lane">上下文平面</text>
    <path d="M 44 595 C 47 592, 50 595, 53 592" fill="none" stroke="#b7791f" stroke-width="3" stroke-linecap="round"/>

    <rect x="80" y="610" width="235" height="128" rx="7" class="box" fill="#f7e5bf"/>
    <text x="197" y="641" text-anchor="middle" class="box-title">候选信息源</text>
    <text x="105" y="670" class="body">策略 · 状态 · recent tail</text>
    <text x="105" y="696" class="body">Memory · RAG · 工件引用</text>
    <text x="105" y="722" class="tiny">来源、时效、信任、依赖</text>

    <rect x="390" y="596" width="240" height="155" rx="7" class="box" fill="#d6eef2"/>
    <text x="510" y="627" text-anchor="middle" class="box-title">Context Builder</text>
    <text x="420" y="658" class="body">Gather → Select</text>
    <text x="420" y="685" class="body">Structure → Compress</text>
    <text x="420" y="714" class="tiny">处理权限、冲突与原子组</text>
    <text x="420" y="737" class="tiny">记录选中与丢弃原因</text>

    <rect x="705" y="610" width="190" height="128" rx="7" class="box" fill="#fff1bf"/>
    <text x="800" y="641" text-anchor="middle" class="box-title">Budget Guard</text>
    <text x="730" y="671" class="body">必选项先入场</text>
    <text x="730" y="697" class="body">token · 延迟 · 风险</text>
    <text x="730" y="722" class="tiny">超限则显式失败</text>

    <rect x="985" y="610" width="190" height="128" rx="7" class="box" fill="#ffd9e2"/>
    <text x="1080" y="641" text-anchor="middle" class="box-title">Model Call</text>
    <text x="1010" y="671" class="body">临时 Context Bundle</text>
    <text x="1010" y="697" class="body">输出或工具请求</text>
    <text x="1010" y="722" class="tiny">结果回到事件日志</text>

    <path d="M 655 508 C 655 544, 510 544, 510 576 L 510 594" class="soft-arrow"/>
    <path d="M 315 674 C 338 671, 354 677, 370 674 L 388 674" class="arrow"/>
    <path d="M 630 674 C 652 671, 668 677, 685 674 L 703 674" class="arrow"/>
    <path d="M 895 674 C 920 671, 944 677, 965 674 L 983 674" class="arrow"/>

    <path d="M 1175 674 C 1207 674, 1225 650, 1225 620 L 1225 180 C 1225 145, 1195 112, 1150 112 L 535 112 L 535 133" class="arrow"/>
    <text x="1192" y="425" transform="rotate(-90 1192 425)" class="tiny">新输出与工具事件</text>

    <text x="55" y="808" class="lane">恢复与分支</text>
    <path d="M 44 819 C 47 816, 50 819, 53 816" fill="none" stroke="#6d5cae" stroke-width="3" stroke-linecap="round"/>
    <path d="M 1000 490 C 1000 535, 950 545, 950 575 L 950 760 L 345 760" fill="none" stroke="#64748b" stroke-width="1.9" stroke-dasharray="7 6" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="250" y="782" width="190" height="72" rx="7" class="box" fill="#e2f4df"/>
    <text x="345" y="812" text-anchor="middle" class="box-title">Resume</text>
    <text x="345" y="837" text-anchor="middle" class="tiny">检查点 + tail 继续</text>

    <rect x="535" y="782" width="190" height="72" rx="7" class="box" fill="#d9efff"/>
    <text x="630" y="812" text-anchor="middle" class="box-title">Workflow Replay</text>
    <text x="630" y="837" text-anchor="middle" class="tiny">重放前先协调副作用</text>

    <rect x="820" y="782" width="190" height="72" rx="7" class="box" fill="#e8def8"/>
    <text x="915" y="812" text-anchor="middle" class="box-title">Fork</text>
    <text x="915" y="837" text-anchor="middle" class="tiny">保留父分支与起点</text>

    <path d="M 345 760 L 345 780" class="soft-arrow"/>
    <path d="M 630 760 L 630 780" class="soft-arrow"/>
    <path d="M 915 760 L 915 780" class="soft-arrow"/>
  </g>
</svg>
